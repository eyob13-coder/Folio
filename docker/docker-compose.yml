services:
  postgres:
    image: postgres:16-alpine
    container_name: folio-postgres
    environment:
      POSTGRES_DB: folio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: folio-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: folio-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/folio_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: folio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
